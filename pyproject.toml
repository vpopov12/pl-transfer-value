[project]
name = "pl-transfer-value"
version = "0.1.0"
description = "Predict Premier League player transfer market value and value growth from performance and age."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "xgboost>=2.1",
    "jupyter>=1.1",
    "kagglehub>=0.3",
    "pyarrow>=17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "black>=24.8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.black]
line-length = 110

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
