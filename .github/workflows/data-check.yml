name: Data check

# Weekly: has the upstream Kaggle dataset been re-scraped past the frozen forecasts'
# due dates? Downloads the current dataset, reports how far it extends, and scores
# every frozen forecast file against it. The tables land in the job summary, and the
# first time a dataset version gives any frozen prediction a real outcome, the job
# opens a GitHub issue so the result doesn't sit unnoticed in a run summary.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the issue instead of opening it"
        type: boolean
        default: false
      pretend_scoreable:
        description: "Test the issue path as if outcomes had arrived (always a dry run)"
        type: boolean
        default: false
      full_check:
        description: "Download and score even if Kaggle's version hasn't changed"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  score-forecasts:
    runs-on: ubuntu-latest
    env:
      # Optional: the dataset is public and downloads anonymously; set these repo
      # secrets only if Kaggle starts requiring a login.
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      # Upstream collection is paused (see README), so most weeks nothing has changed.
      # Asking Kaggle for its version number is a tiny request; the full check below
      # downloads the whole ~870 MB dataset, so it only runs when there's a newer version
      # than the latest frozen forecast was made from. If the lookup fails, run the full
      # check anyway rather than silently skipping.
      - name: Is there a newer dataset version?
        id: version
        env:
          FULL_CHECK: ${{ inputs.full_check == true || inputs.pretend_scoreable == true }}
        run: |
          frozen=$(ls forecasts/forward_*_data*.csv | sed -E 's/.*_data([0-9]+)\.csv/\1/' | sort -n | tail -1)
          current=$(curl -sf -m 60 https://www.kaggle.com/api/v1/datasets/view/davidcariboo/player-scores \
            | jq -r '.currentVersionNumber // empty' || true)
          if [ "$FULL_CHECK" = "true" ]; then
            reason="full check requested"
            skip=false
          elif [ -z "$current" ]; then
            reason="could not read Kaggle's version number, so running the full check"
            skip=false
          elif [ "$current" -le "$frozen" ]; then
            reason="Kaggle is still on version $current, the version the latest frozen forecast was made from. No new data: skipping the download."
            skip=true
          else
            reason="Kaggle has version $current, newer than frozen version $frozen: running the full check."
            skip=false
          fi
          echo "$reason"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          { echo "## Dataset version"; echo; echo "$reason"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@v10.1.0
        if: steps.version.outputs.skip != 'true'
        with:
          enable-cache: true

      - name: Install dependencies (from lockfile)
        if: steps.version.outputs.skip != 'true'
        run: uv sync --all-groups --locked

      - name: Report dataset currency
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            echo "## Dataset currency"
            echo '```'
            uv run python -m src.data_refresh
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Score frozen forecasts
        if: steps.version.outputs.skip != 'true'
        run: |
          {
            echo "## Frozen forecast scores"
            echo '```'
            uv run python -m src.forecast --score --summary-json score.json --issue-body issue.md
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open an issue when frozen forecasts get real outcomes
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRETEND: ${{ inputs.pretend_scoreable == true }}
          DRY_RUN: ${{ inputs.dry_run == true || inputs.pretend_scoreable == true }}
        run: |
          resolved=$(jq -r .rows_resolved score.json)
          version=$(jq -r .dataset_version score.json)
          if [ "$resolved" = "0" ] && [ "$PRETEND" != "true" ]; then
            echo "No frozen prediction has an outcome yet in dataset version $version; nothing to report."
            exit 0
          fi
          title="Frozen forecasts can now be scored (dataset version $version)"
          # One issue per dataset version, ever: closing it does not reopen it next week.
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json title \
            --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$existing" != "0" ]; then
            echo "An issue titled '$title' already exists; not opening another."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would open an issue titled '$title' with this body:"
            cat issue.md
            exit 0
          fi
          gh issue create --title "$title" --body-file issue.md
